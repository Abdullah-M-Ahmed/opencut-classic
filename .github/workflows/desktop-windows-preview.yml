name: Desktop Windows Preview

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/desktop-electron/**"
      - ".github/workflows/desktop-windows-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
      DATABASE_URL: "postgresql://opencut:opencut@127.0.0.1:5432/opencut"
      BETTER_AUTH_SECRET: "build-only-desktop-placeholder-do-not-use-in-production"
      UPSTASH_REDIS_REST_URL: "http://127.0.0.1:8079"
      UPSTASH_REDIS_REST_TOKEN: "build-placeholder"
      MARBLE_WORKSPACE_KEY: "build-placeholder"
      FREESOUND_CLIENT_ID: "build-placeholder"
      FREESOUND_API_KEY: "build-placeholder"
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install

      - name: Validate launcher syntax
        run: bun run --cwd apps/desktop-electron check

      - name: Build OpenCut editor
        run: bun run build:web

      - name: Package Windows desktop installer
        run: bun run --cwd apps/desktop-electron package:windows

      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-Desktop-Windows-preview
          path: apps/desktop-electron/dist/*.exe
          if-no-files-found: error
          retention-days: 14
